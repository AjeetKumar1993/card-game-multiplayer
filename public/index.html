
<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>साझा स्कोर कार्ड — मोबाइल गेम</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root {
  --felt: #0a4a25;
  --panel: #041f12;
  --gold: #ffd166;
  --red: #e53935;
  --bg-dark: #071b14;
}
* {
  box-sizing: border-box;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
body {
  margin: 0;
  padding: 0;
  background: radial-gradient(circle at center, #11733a 0%, #075126 60%, #032c17 100%);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}
button, select, input { font: inherit; }
button {
  cursor: pointer;
  border: 0;
  border-radius: 8px;
  padding: 10px 14px;
  font-weight: 700;
  background: var(--gold);
  color: #182315;
}
button:active { transform: scale(0.98); }
button:disabled { opacity: 0.4; cursor: not-allowed; }

/* TOP NAVBAR */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--panel);
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  z-index: 10;
}
.brand { font-size: 14px; font-weight: 800; }

/* SCORE BAR */
.scorebar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 10px;
  background: rgba(0, 0, 0, 0.4);
  font-size: 11px;
  font-weight: 700;
  gap: 4px;
}
.team1 { color: #8ed0ff; }
.team2 { color: #ffaaaa; }
.main-score {
  font-size: 13px;
  color: var(--gold);
  background: rgba(0, 0, 0, 0.6);
  padding: 3px 8px;
  border-radius: 12px;
  border: 1px solid rgba(255, 209, 102, 0.3);
}
.btn-score {
  padding: 4px 8px;
  font-size: 10px;
  background: #2196f3;
  color: #fff;
}

/* TRACK BAR */
.track {
  display: flex;
  align-items: center;
  justify-content: space-around;
  flex-wrap: wrap;
  padding: 4px 8px;
  background: rgba(0, 0, 0, 0.2);
  font-size: 11px;
}
.pill {
  border-radius: 12px;
  padding: 3px 8px;
  background: #9b5a0b;
  color: #fff;
  font-weight: 700;
  font-size: 10px;
}

/* STATUS MESSAGE */
.status {
  text-align: center;
  padding: 6px 8px;
  color: #ffe88b;
  font-weight: 700;
  font-size: 12px;
  min-height: 28px;
}

/* MOBILE GAME LAYOUT */
.table {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 4px 8px 8px;
  max-width: 600px;
  margin: 0 auto;
  width: 100%;
}
.north, .south {
  display: flex;
  justify-content: center;
  width: 100%;
}
.middle {
  display: grid;
  grid-template-columns: 75px 1fr 75px;
  align-items: center;
  gap: 4px;
  margin: 6px 0;
  flex: 1;
}
.side {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* PLAY ARENA */
.arena {
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  background: rgba(0, 44, 22, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 150px;
  height: 100%;
  padding: 6px;
  position: relative;
}
.arena-label {
  position: absolute;
  top: 4px;
  left: 0;
  right: 0;
  text-align: center;
  color: rgba(255, 255, 255, 0.4);
  font-size: 9px;
  text-transform: uppercase;
}
.trick-cards {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
  width: 100%;
  max-height: 55vh;
  overflow-y: auto;
  padding-top: 14px;
}
.trick-group {
  padding: 4px;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.2);
}
.trick-heading {
  margin-bottom: 4px;
  text-align: center;
  font-size: 9px;
  color: var(--gold);
}
.trick-plays {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 3px;
  justify-items: center;
}
.full-house-reveal {
  margin: 4px auto;
  padding: 6px 8px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.35);
  text-align: center;
  width: min(100% - 16px, 600px);
  overflow: hidden;
}
.full-house-reveal-title {
  margin-bottom: 5px;
  color: var(--gold);
  font-size: 11px;
  font-weight: 700;
}
.reveal-hand {
  display: flex;
  justify-content: flex-start;
  gap: 3px;
  overflow-x: auto;
  padding: 0 0 4px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}
.reveal-hand .card {
  flex: 0 0 clamp(22px, 6.6vw, 36px);
  width: clamp(22px, 6.6vw, 36px);
  height: auto;
  aspect-ratio: 5 / 7;
  min-width: 0;
  margin: 0;
}
.played {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 0;
  font-size: 8px;
  color: #d8f2df;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* PLAYER BADGES */
.badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 110px;
  padding: 4px 6px;
  border-radius: 8px;
  background: rgba(163, 35, 35, 0.85);
  border: 1.5px solid transparent;
  text-align: center;
}
.badge.t1 { background: rgba(7, 90, 155, 0.85); }
.badge.active { background: var(--gold); color: #172319; border-color: #fff; }
.badge.dealer { outline: 2px solid var(--gold); }
.badge .name {
  font-weight: 800;
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 90px;
}
.badge .sub { font-size: 9px; opacity: 0.9; }

/* CARD & HAND DISPLAY */
.hand-container {
  width: 100%;
  overflow-x: auto;
  padding: 4px 0 8px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.hand-container::-webkit-scrollbar { display: none; }
.hand {
  display: flex;
  justify-content: center;
  min-width: max-content;
  margin: 0 auto;
  padding: 0 10px;
}
.card {
  position: relative;
  flex: 0 0 auto;
  width: clamp(42px, 12vw, 56px);
  height: clamp(60px, 17vw, 80px);
  margin-left: clamp(-18px, -4vw, -12px);
  border-radius: 5px;
  background: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  transition: transform 0.1s ease;
  user-select: none;
  overflow: hidden;
  border: 1px solid #aaa;
}
.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
}
.card:first-child { margin-left: 0; }
.card.playable {
  border: 2px solid var(--gold);
  box-shadow: 0 0 0 2px rgba(255, 209, 102, 0.5);
  cursor: pointer;
}
.card.playable:active { transform: translateY(-8px); }
.card.disabled {
  opacity: 0.4;
  filter: grayscale(40%);
}
.card.small {
  width: clamp(26px, 8vw, 34px);
  height: clamp(37px, 11vw, 48px);
  margin: 0;
}
.reveal-hand .card.small {
  flex-basis: clamp(22px, 6.6vw, 36px);
  width: clamp(22px, 6.6vw, 36px);
  height: auto;
  aspect-ratio: 5 / 7;
}

/* MODALS & OVERLAYS */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  z-index: 100;
}
.dialog {
  width: 100%;
  max-width: 400px;
  background: #132b24;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  max-height: 92vh;
  overflow-y: auto;
}

/* बोली वाले popup में खिलाड़ी के सभी 5 कार्ड साफ दिखें */
.bid-dialog {
  max-width: 520px;
  padding: 14px;
}
.bid-hand-title {
  margin: 8px 0 6px;
  font-size: 13px;
  color: #dbe8df;
  font-weight: 700;
}
.bid-hand {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(4px, 1.5vw, 10px);
  width: 100%;
  margin: 8px 0 14px;
}
.bid-hand .card {
  width: clamp(0px, calc((100vw - 88px) / 5), 76px);
  height: auto;
  aspect-ratio: 5 / 7;
  margin-left: 0;
  flex: 1 1 0;
  min-width: 0;
  max-width: 76px;
}
.bid-hand .card img { object-fit: contain; }
.trump-hand {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
  width: 100%;
  margin: 8px 0 14px;
}
.trump-hand .card {
  width: 100%;
  height: auto;
  aspect-ratio: 5 / 7;
  margin: 0;
  min-width: 0;
}
.trump-hand .card img { object-fit: contain; }
.bid-dialog .actions button { min-height: 44px; }
@media (max-width: 360px) {
  .bid-dialog { padding: 10px; }
  .bid-hand { gap: 3px; }
}
.dialog h2 {
  margin: 0 0 10px;
  font-size: 16px;
  color: var(--gold);
}
.dialog input, .dialog select {
  width: 100%;
  padding: 10px;
  background: var(--bg-dark);
  color: #fff;
  border: 1px solid #527461;
  border-radius: 6px;
  margin: 6px 0 12px;
}
.actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
.secondary {
  background: #dbe8df;
  color: #132b24;
}
.suits {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin: 12px 0;
}
.suitbtn {
  font-size: 14px;
  padding: 10px 0;
  background: #fff;
  color: #111;
  border-radius: 6px;
  font-weight: bold;
}
.suitbtn.red { color: var(--red); }
.score-table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
  text-align: center;
  font-size: 10px;
}
.score-table th, .score-table td {
  border: 1px solid #527461;
  padding: 5px 3px;
}
.score-table th {
  background: var(--bg-dark);
  color: var(--gold);
}
.voice-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 6px 10px;
  background: rgba(0, 0, 0, 0.25);
}
.voice-controls button {
  padding: 6px 10px;
  font-size: 11px;
}
.voice-status {
  color: #dbe8df;
  font-size: 11px;
}
.remote-audio {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="loginModal" class="overlay">
  <div class="dialog">
    <h2>गेम में शामिल हों</h2>
    <label style="font-size:12px;">आपका नाम:</label>
    <input type="text" id="playerNameInput" placeholder="खिलाड़ी" value="खिलाड़ी">
    <label style="font-size:12px;">रूम कोड:</label>
    <input type="text" id="roomCodeInput" placeholder="ROOM1" value="ROOM1">
    <div class="actions">
      <button id="joinGameBtn" style="width:100%;">खेल शुरू करें</button>
    </div>
  </div>
</div>

<header class="top">
  <div class="brand">♠ साझा स्कोर गेम</div>
  <span id="roomLabel" style="font-weight:bold;color:var(--gold);font-size:12px;">रूम: —</span>
</header>

<div id="voiceControls" class="voice-controls hidden">
  <button id="voiceStartBtn" type="button">🎙️ आवाज़ चालू करें</button>
  <button id="voiceMuteBtn" type="button" class="secondary hidden">म्यूट करें</button>
  <button id="voiceLeaveBtn" type="button" class="secondary hidden">आवाज़ बंद करें</button>
  <span id="voiceStatus" class="voice-status" aria-live="polite">माइक बंद है</span>
</div>
<div id="remoteAudio" class="remote-audio" aria-hidden="true"></div>

<div class="scorebar">
  <span class="team1">टीम 1 (जीत: <b id="teamGameWins1">0</b>/3)</span>
  <span class="main-score">स्कोर: <b id="sharedScore">0</b> / 52</span>
  <button id="checkScoreBtn" class="btn-score">📊 स्कोर</button>
  <span class="team2">टीम 2 (जीत: <b id="teamGameWins2">0</b>/3)</span>
</div>

<div class="track">
  <span id="gamePill" class="pill">गेम: 1</span>
  <span id="dealerPill" class="pill">डीलर: —</span>
  <span id="trumpPill" class="pill">ट्रंप: —</span>
  <span id="bidPill" class="pill">बोली: —</span>
  <span id="trickLabel" class="pill">1/13</span>
</div>

<div id="status" class="status">खिलाड़ियों का इंतज़ार है...</div>
<div id="lobbyControls" class="dialog hidden" style="margin:0 auto 8px;max-width:400px;"></div>
<div id="fullHouseAction" class="actions" style="justify-content:center;"></div>
<div id="fullHouseReveal" class="full-house-reveal hidden"></div>

<main class="table">
  <div class="north" id="badge2"></div>
  <div class="middle">
    <div class="side" id="badge1"></div>
    <section class="arena">
      <div class="arena-label">पिछली लंबित चाल / वर्तमान चाल</div>
      <div id="trickCards" class="trick-cards"></div>
    </section>
    <div class="side" id="badge3"></div>
  </div>
  <div class="south" id="badge0"></div>
  <div class="hand-container">
    <div id="hand" class="hand"></div>
  </div>
</main>

<div id="modalRoot"></div>

<script>
"use strict";

const socket = io();
const SESSION_STORAGE_KEY = "callBreakRoomSession";
const SUITS = [
  {name:"हुकुम (Spades)",symbol:"♠",code:"S",red:false},
  {name:"पान (Hearts)",symbol:"♥",code:"H",red:true},
  {name:"ईंट (Diamonds)",symbol:"♦",code:"D",red:true},
  {name:"चिड़ी (Clubs)",symbol:"♣",code:"C",red:false}
];

let myRoomCode = "";
let myName = "";
let roomData = null;
let reconnectToken = "";
let hasRoomSession = false;
let voiceStream = null;
let voiceActive = false;
const voicePeers = new Map();

const $ = id => document.getElementById(id);

function updateVoiceUi(message) {
  const joined = Boolean(getMyPlayer());
  $("voiceControls").classList.toggle("hidden", !joined);
  $("voiceStartBtn").classList.toggle("hidden", voiceActive);
  $("voiceMuteBtn").classList.toggle("hidden", !voiceActive);
  $("voiceLeaveBtn").classList.toggle("hidden", !voiceActive);

  if (message) {
    $("voiceStatus").textContent = message;
  } else if (!voiceActive) {
    $("voiceStatus").textContent = "माइक बंद है";
  } else {
    const audioTrack = voiceStream && voiceStream.getAudioTracks()[0];
    const connectedPeers = [...voicePeers.values()].filter(
      peer => peer.pc.connectionState === "connected"
    ).length;
    $("voiceMuteBtn").textContent =
      audioTrack && !audioTrack.enabled ? "अनम्यूट करें" : "म्यूट करें";
    $("voiceStatus").textContent = audioTrack && !audioTrack.enabled
      ? `माइक म्यूट है · ${connectedPeers} खिलाड़ी जुड़े`
      : `आवाज़ चालू · ${connectedPeers} खिलाड़ी जुड़े`;
  }
}

function sendVoiceSignal(peerId, signal) {
  socket.emit("voice:signal", {
    roomCode: myRoomCode,
    to: peerId,
    ...signal
  });
}

function createVoicePeer(peerId) {
  if (!voiceActive || voicePeers.has(peerId)) return voicePeers.get(peerId);

  const pc = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
  });
  const peer = { pc, pendingCandidates: [], audio: null };
  voicePeers.set(peerId, peer);

  voiceStream.getTracks().forEach(track => pc.addTrack(track, voiceStream));
  pc.onicecandidate = event => {
    if (event.candidate && voiceActive) {
      sendVoiceSignal(peerId, { candidate: event.candidate });
    }
  };
  pc.ontrack = event => {
    if (!voiceActive || !event.streams[0]) return;
    if (!peer.audio) {
      peer.audio = document.createElement("audio");
      peer.audio.autoplay = true;
      peer.audio.playsInline = true;
      $("remoteAudio").appendChild(peer.audio);
    }
    peer.audio.srcObject = event.streams[0];
    peer.audio.play().catch(() => {
      updateVoiceUi("दूसरों की आवाज़ सुनने के लिए पेज पर टैप करें");
    });
  };
  pc.onconnectionstatechange = () => updateVoiceUi();

  return peer;
}

async function createVoiceOffer(peerId, peer) {
  try {
    const offer = await peer.pc.createOffer();
    await peer.pc.setLocalDescription(offer);
    sendVoiceSignal(peerId, { description: peer.pc.localDescription });
  } catch (error) {
    console.error("Could not start voice connection:", error);
    updateVoiceUi("आवाज़ कनेक्शन शुरू नहीं हो सका");
  }
}

function connectVoicePeer(peerId) {
  if (!voiceActive || peerId === socket.id) return;
  const peer = createVoicePeer(peerId);
  if (peer && socket.id.localeCompare(peerId) < 0 && !peer.pc.localDescription) {
    createVoiceOffer(peerId, peer);
  }
}

async function applyVoiceSignal(payload) {
  if (!payload || typeof payload !== "object") return;
  const { from, description, candidate } = payload;
  if (!voiceActive || typeof from !== "string") return;
  const peer = createVoicePeer(from);
  if (!peer) return;

  try {
    if (description) {
      await peer.pc.setRemoteDescription(description);
      while (peer.pendingCandidates.length) {
        await peer.pc.addIceCandidate(peer.pendingCandidates.shift());
      }

      if (description.type === "offer") {
        const answer = await peer.pc.createAnswer();
        await peer.pc.setLocalDescription(answer);
        sendVoiceSignal(from, { description: peer.pc.localDescription });
      }
    } else if (candidate) {
      if (peer.pc.remoteDescription) {
        await peer.pc.addIceCandidate(candidate);
      } else {
        peer.pendingCandidates.push(candidate);
      }
    }
  } catch (error) {
    console.error("Could not establish voice connection:", error);
    updateVoiceUi("आवाज़ कनेक्शन में समस्या हुई");
  }
}

function closeVoicePeer(peerId) {
  const peer = voicePeers.get(peerId);
  if (!peer) return;
  peer.pc.close();
  if (peer.audio) {
    peer.audio.srcObject = null;
    peer.audio.remove();
  }
  voicePeers.delete(peerId);
}

function stopVoice(notifyServer = true) {
  if (notifyServer && voiceActive) {
    socket.emit("voice:leave", { roomCode: myRoomCode });
  }
  voiceActive = false;
  if (voiceStream) {
    voiceStream.getTracks().forEach(track => track.stop());
    voiceStream = null;
  }
  [...voicePeers.keys()].forEach(closeVoicePeer);
  updateVoiceUi();
}

async function startVoice() {
  if (!roomData || !getMyPlayer()) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    updateVoiceUi("माइक के लिए सुरक्षित HTTPS कनेक्शन ज़रूरी है");
    return;
  }

  $("voiceStartBtn").disabled = true;
  try {
    voiceStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: false
    });
    voiceActive = true;
    socket.emit("voice:join", { roomCode: myRoomCode });
    updateVoiceUi("माइक चालू · खिलाड़ियों से जुड़ रहे हैं");
  } catch (error) {
    console.error("Could not access microphone:", error);
    updateVoiceUi(error.name === "NotAllowedError"
      ? "माइक की अनुमति दें और फिर कोशिश करें"
      : "माइक चालू नहीं हो सका");
  } finally {
    $("voiceStartBtn").disabled = false;
  }
}

function getRankCode(v) {
  return v === 10 ? '0' : v === 11 ? 'J' : v === 12 ? 'Q' : v === 13 ? 'K' : v === 14 ? 'A' : String(v);
}
function getRankDisplay(v) {
  return v === 11 ? 'J' : v === 12 ? 'Q' : v === 13 ? 'K' : v === 14 ? 'A' : String(v);
}
function getImageUrl(value, suitCode) {
  return `https://deckofcardsapi.com/static/img/${getRankCode(value)}${suitCode}.png`;
}

function cardHtml(c, small=false, playable=false, disabled=false) {
  const suit = SUITS[c.suit];
  const cls = (playable ? " playable" : "") + (disabled ? " disabled" : "") + (small ? " small" : "");
  return `
    <div class="card${cls}" ${playable ? `data-suit="${c.suit}" data-val="${c.value}"` : ""}>
      <img src="${getImageUrl(c.value, suit.code)}" alt="${getRankDisplay(c.value)}" />
    </div>
  `;
}

$("joinGameBtn").onclick = () => {
  myName = $("playerNameInput").value.trim() || "खिलाड़ी";
  myRoomCode = $("roomCodeInput").value.trim().toUpperCase() || "ROOM1";
  const savedSession = loadSavedSession();
  reconnectToken = savedSession && savedSession.roomCode === myRoomCode
    ? savedSession.reconnectToken
    : "";
  hasRoomSession = true;
  saveRoomSession();
  $("loginModal").classList.add("hidden");
  $("roomLabel").textContent = `रूम: ${myRoomCode}`;
  if (socket.connected) joinRoom();
};

function loadSavedSession() {
  try {
    const saved = JSON.parse(localStorage.getItem(SESSION_STORAGE_KEY) || "null");
    return saved && typeof saved.roomCode === "string" &&
      typeof saved.playerName === "string" &&
      typeof saved.reconnectToken === "string"
      ? saved
      : null;
  } catch (error) {
    console.error("Could not read the saved game session:", error);
    return null;
  }
}

function saveRoomSession() {
  try {
    localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({
      roomCode: myRoomCode,
      playerName: myName,
      reconnectToken
    }));
  } catch (error) {
    console.error("Could not save the game reconnect session:", error);
    $("status").textContent = "ऑटो-रीकनेक्ट सेव नहीं हो सका।";
  }
}

function joinRoom() {
  socket.emit("joinRoom", {
    roomCode: myRoomCode,
    playerName: myName,
    reconnectToken
  });
}

$("checkScoreBtn").onclick = () => showScoreboardModal();

socket.on("connect", () => {
  if (hasRoomSession) joinRoom();
});
socket.on("joinResult", result => {
  if (result && result.ok && typeof result.reconnectToken === "string") {
    reconnectToken = result.reconnectToken;
    saveRoomSession();
    return;
  }

  hasRoomSession = false;
  reconnectToken = "";
  try {
    localStorage.removeItem(SESSION_STORAGE_KEY);
  } catch (error) {
    console.error("Could not clear the saved game session:", error);
  }
  $("status").textContent = result && result.message
    ? result.message
    : "रूम में शामिल नहीं हो सके।";
  $("loginModal").classList.remove("hidden");
});

socket.on('roomStateUpdate', (data) => {
  roomData = data;
  render();
  updateVoiceUi();
});

socket.on("voice:peers", payload => {
  if (payload && Array.isArray(payload.peers)) {
    payload.peers.forEach(connectVoicePeer);
  }
});
socket.on("voice:peerJoined", payload => {
  if (payload && typeof payload.id === "string") connectVoicePeer(payload.id);
});
socket.on("voice:peerLeft", payload => {
  if (payload && typeof payload.id === "string") closeVoicePeer(payload.id);
});
socket.on("voice:signal", applyVoiceSignal);
socket.on("disconnect", () => {
  stopVoice(false);
  if (hasRoomSession) {
    $("status").textContent = "कनेक्शन टूट गया है। अपने-आप फिर जुड़ने की कोशिश हो रही है...";
  }
});

$("voiceStartBtn").onclick = startVoice;
$("voiceMuteBtn").onclick = () => {
  const audioTrack = voiceStream && voiceStream.getAudioTracks()[0];
  if (audioTrack) {
    audioTrack.enabled = !audioTrack.enabled;
    updateVoiceUi();
  }
};
$("voiceLeaveBtn").onclick = () => stopVoice();

function getMyPlayer() {
  return roomData ? roomData.players.find(p => p.id === socket.id) : null;
}

const savedSession = loadSavedSession();
if (savedSession) {
  myRoomCode = savedSession.roomCode;
  myName = savedSession.playerName;
  reconnectToken = savedSession.reconnectToken;
  hasRoomSession = true;
  $("playerNameInput").value = myName;
  $("roomCodeInput").value = myRoomCode;
  $("loginModal").classList.add("hidden");
  $("roomLabel").textContent = `रूम: ${myRoomCode}`;
  $("status").textContent = "पिछले गेम से दोबारा जुड़ रहे हैं...";
}

function render() {
  if (!roomData) return;
  const myPlayer = getMyPlayer();

  if (roomData.gameState === 'LOBBY') {
    $("status").textContent = roomData.roomMessage ||
      `खिलाड़ियों का इंतज़ार जारी है (${roomData.players.length}/4)...`;
  }
  const lobbyControls = $("lobbyControls");
  if (roomData.gameState === 'LOBBY') {
    const isHost = myPlayer && roomData.hostId === myPlayer.id;
    const teammates = myPlayer
      ? roomData.players.filter(player =>
          player.seatIndex === (myPlayer.seatIndex + 2) % 4
        )
      : [];
    if (isHost) {
      lobbyControls.classList.remove("hidden");
      lobbyControls.innerHTML = `
        <h2>टीम चुनें और गेम शुरू करें</h2>
        <p style="font-size:12px;">
          अपना आमने-सामने बैठने वाला साथी चुनें। खिलाड़ी 1 और 3 एक टीम में,
          और खिलाड़ी 2 और 4 दूसरी टीम में होंगे।
        </p>
        <select id="teammateSelect" ${roomData.players.length !== 4 ? "disabled" : ""}>
          <option value="">साथी चुनें</option>
          ${teammates.map(player => `
            <option value="${player.id}" ${roomData.selectedPartnerId === player.id ? "selected" : ""}>
              ${player.name}
            </option>
          `).join("")}
        </select>
        <p style="font-size:12px;">
          ${roomData.selectedPartnerId
            ? `टीम 1: ${myPlayer.name} और ${roomData.players.find(player => player.id === roomData.selectedPartnerId).name}. बाकी दोनों खिलाड़ी टीम 2 में होंगे।`
            : "बाकी दो खिलाड़ी आपकी विरोधी टीम होंगे।"}
        </p>
        <button id="startGameBtn" style="width:100%;"
          ${roomData.players.length !== 4 || !roomData.selectedPartnerId ? "disabled" : ""}>
          गेम शुरू करें (${roomData.players.length}/4)
        </button>
      `;
      const teammateSelect = $("teammateSelect");
      teammateSelect.onchange = () => {
        if (teammateSelect.value) {
          socket.emit('selectTeammate', {
            roomCode: myRoomCode,
            teammateId: teammateSelect.value
          });
        }
      };
      $("startGameBtn").onclick = () => {
        socket.emit('startGame', {roomCode: myRoomCode});
      };
    } else {
      lobbyControls.classList.add("hidden");
      lobbyControls.innerHTML = "";
    }
  } else {
    lobbyControls.classList.add("hidden");
    lobbyControls.innerHTML = "";
  }

  const dealer = roomData.players[roomData.dealerIndex];
  $("dealerPill").textContent = `डीलर: ${dealer ? dealer.name : '—'}`;
  $("gamePill").textContent = `गेम: ${roomData.gameNumber}`;
  $("sharedScore").textContent = roomData.gameScore;
  $("teamGameWins1").textContent = roomData.teamGameWins[0];
  $("teamGameWins2").textContent = roomData.teamGameWins[1];

  if (roomData.gameState === 'AUCTION') {
    const bidderTurn = roomData.players[roomData.auctionTurnIndex];
    $("status").textContent = `बोली प्रक्रिया: ${bidderTurn ? bidderTurn.name : 'खिलाड़ी'} की बारी`;
  } else if (roomData.gameState === 'TRUMP_SELECT') {
    const bidder = roomData.players[roomData.bidderIndex];
    $("status").textContent = roomData.fullHouse
      ? `${bidder ? bidder.name : 'खिलाड़ी'} ने Full House (खुल्ली) कहा है और ट्रंप चुन रहे हैं।`
      : bidder
        ? `${bidder.name} ट्रंप का रंग चुन रहे हैं।`
        : "ट्रंप का चुनाव जारी...";
  } else if (roomData.gameState === 'PLAYING') {
    const current = roomData.players[roomData.turnIndex];
    $("status").textContent = roomData.fullHouse
      ? `Full House (खुल्ली): ${roomData.players[roomData.fullHouse.callerSeat].name} की टीम को सभी 13 चालें जीतनी हैं। ${current ? `बारी: ${current.name}` : ''}`
      : current ? `बारी: ${current.name}` : "खेल जारी...";
  } else if (roomData.gameState === 'HAND_OVER') {
    $("status").textContent = roomData.fullHouse
      ? `${roomData.roundMessage || `Full House ${roomData.fullHouse.result === 'SUCCESS' ? 'सफल' : 'असफल'}`} वर्तमान स्कोर: ${roomData.gameScore}`
      : roomData.roundMessage || `राउंड समाप्त! वर्तमान स्कोर: ${roomData.gameScore}`;
  } else if (roomData.gameState === 'MATCH_OVER') {
    $("status").textContent = roomData.roundMessage ||
      `🏆 मैच समाप्त! टीम ${roomData.trophyWinner} ने ट्रॉफी जीती!`;
  }

  const disconnectedPlayers = roomData.players
    .filter(player => player.connected === false)
    .map(player => player.name);
  if (disconnectedPlayers.length) {
    $("status").textContent +=
      ` · ${disconnectedPlayers.join(", ")} का कनेक्शन टूट गया है; 5 मिनट तक इंतज़ार होगा।`;
  }

  $("trickLabel").textContent = `${roomData.trickNo}/13`;
  $("trumpPill").textContent = roomData.trumpSuit === null
    ? "ट्रंप: —"
    : `ट्रंप: ${SUITS[roomData.trumpSuit].symbol}`;
  const bidder = roomData.players[roomData.bidderIndex];
  $("bidPill").textContent = roomData.fullHouse &&
    roomData.fullHouse.phase === 'INITIAL'
    ? `बोली: खुल्ली — ${roomData.players[roomData.fullHouse.callerSeat].name}`
    : bidder && roomData.bidderIndex !== -1
      ? `सर्वोच्च बोली: ${roomData.highestBid} — ${bidder.name}`
      : `सर्वोच्च बोली: ${roomData.highestBid} — अभी कोई बोली नहीं`;

  const canCallLateFullHouse =
    roomData.gameState === 'PLAYING' &&
    !roomData.fullHouse &&
    roomData.trickNo === 1 &&
    roomData.currentTrick.length === 0 &&
    roomData.pendingTricks.length === 0;
  $("fullHouseAction").innerHTML = canCallLateFullHouse
    ? '<button id="lateFullHouseBtn">Full House (खुल्ली) कहें</button>'
    : "";
  if (canCallLateFullHouse) {
    $("lateFullHouseBtn").onclick = () => {
      socket.emit('callFullHouse', {roomCode: myRoomCode});
    };
  }

  const allRevealedHands = Array.isArray(roomData.revealedFullHouseHands)
    ? roomData.revealedFullHouseHands
    : [];
  const teammates = roomData.fullHouse
    ? roomData.players.filter(player =>
        player.seatIndex === roomData.fullHouse.callerSeat ||
        player.seatIndex === roomData.fullHouse.partnerSeat
      )
    : [];
  const myTeamIsInFullHouse = Boolean(
    myPlayer &&
    teammates.some(player => player.id === myPlayer.id)
  );
  const revealedHands = myTeamIsInFullHouse
    ? allRevealedHands.filter(entry => entry.seat !== myPlayer.seatIndex)
    : allRevealedHands;
  const revealEl = $("fullHouseReveal");
  if (roomData.fullHouse && revealedHands.some(entry => entry.hand.length > 0)) {
    revealEl.classList.remove("hidden");
    revealEl.innerHTML = `
      <div class="full-house-reveal-title">
        ${myTeamIsInFullHouse
          ? "आपके साथी के Full House कार्ड"
          : "Full House के दोनों खिलाड़ियों के कार्ड"}
      </div>
      ${revealedHands.map(entry => {
        const player = roomData.players[entry.seat];
        return `
          <div class="full-house-reveal-title">${player ? player.name : 'खिलाड़ी'}</div>
          <div class="reveal-hand">${entry.hand.map(card => cardHtml(card, true)).join("")}</div>
        `;
      }).join("")}
    `;
  } else {
    revealEl.classList.add("hidden");
    revealEl.innerHTML = "";
  }

  const mySeat = myPlayer ? myPlayer.seatIndex : 0;

  for (let relative = 0; relative < 4; relative++) {
    const actualSeat = (mySeat + relative) % 4;
    const player = roomData.players[actualSeat];
    const badgeEl = $(`badge${relative}`);

    if (player) {
      const isTurn = roomData.gameState === 'AUCTION'
        ? roomData.auctionTurnIndex === actualSeat
        : roomData.gameState === 'PLAYING' &&
          roomData.turnIndex === actualSeat;
      const isDealer = roomData.dealerIndex === actualSeat;
      const sub = roomData.gameState === 'AUCTION'
        ? (player.hasPassed ? "पास" : player.currentBid ? `बोली:${player.currentBid}` : "इंतज़ार")
        : `जीत:${player.tricksWon}`;

      badgeEl.innerHTML = `
        <div class="badge ${player.teamId === 1 ? "t1" : ""} ${isTurn ? "active" : ""} ${isDealer ? "dealer" : ""}">
          <div class="name">${player.name} ${actualSeat === mySeat ? "(आप)" : ""}</div>
          <div class="sub">${player.connected === false ? "पुनः जुड़ रहे हैं" : sub} ${isDealer ? "🃏" : ""}</div>
        </div>
      `;
    } else {
      badgeEl.innerHTML = `<div class="badge"><div class="name">खाली</div></div>`;
    }
  }

  const currentTrick = Array.isArray(roomData.currentTrick) ? roomData.currentTrick : [];
  const pendingTricks = Array.isArray(roomData.pendingTricks)
    ? roomData.pendingTricks
    : [];
  const renderPlays = plays => plays.map(play => {
    const player = roomData.players[play.playerIndex];
    return `
      <div class="played" title="${player ? player.name : 'खिलाड़ी'}">
        <span>${player ? player.name : 'खिलाड़ी'}</span>
        ${cardHtml(play.card, true)}
      </div>
    `;
  }).join("");
  const latestPendingTrick = pendingTricks.length
    ? pendingTricks[pendingTricks.length - 1]
    : null;
  const pendingTrickHtml = [];
  if (latestPendingTrick) {
    const trick = latestPendingTrick;
    const winner = roomData.players[trick.winnerSeat];
    pendingTrickHtml.push(`
      <div class="trick-group">
        <div class="trick-heading">चाल ${trick.trickNo} — ${winner ? winner.name : 'खिलाड़ी'} जीते</div>
        <div class="trick-plays">${renderPlays(trick.plays)}</div>
      </div>
    `);
  }
  if (currentTrick.length > 0) {
    pendingTrickHtml.push(`
      <div class="trick-group">
        <div class="trick-heading">वर्तमान चाल</div>
        <div class="trick-plays">${renderPlays(currentTrick)}</div>
      </div>
    `);
  }
  $("trickCards").innerHTML = pendingTrickHtml.join("");

  if (myPlayer) {
    const isMyTurn = roomData.gameState === 'PLAYING' &&
      roomData.turnIndex === myPlayer.seatIndex;
    let validMoves = [];

    if (isMyTurn) {
      if (currentTrick.length === 0) {
        validMoves = [...myPlayer.hand];
      } else {
        const led = currentTrick[0].card.suit;
        const same = myPlayer.hand.filter(c => c.suit === led);
        validMoves = same.length ? same : [...myPlayer.hand];
      }
    }

    $("hand").innerHTML = myPlayer.hand.map(c => {
      const ok = validMoves.some(x => x.suit === c.suit && x.value === c.value);
      return cardHtml(c, false, ok, isMyTurn && !ok);
    }).join("");

    document.querySelectorAll("#hand .card.playable").forEach(el => {
      el.onclick = () => {
        const suit = Number(el.dataset.suit);
        const val = Number(el.dataset.val);
        socket.emit('playCard', {
          roomCode: myRoomCode,
          card: {suit, value: val}
        });
      };
    });
  }

  handleDialogs(myPlayer);
}

function handleDialogs(myPlayer) {
  if (!myPlayer) return;
  const modalRoot = $("modalRoot");

  if (roomData.gameState === 'AUCTION' &&
      roomData.auctionTurnIndex === myPlayer.seatIndex) {
    const min = roomData.bidderIndex === -1
      ? 8
      : roomData.highestBid + 1;
    const options = Array.from(
      {length: Math.max(0, 14 - min)},
      (_, i) => `<option value="${min+i}">${min+i} हाथ</option>`
    ).join("");

    modalRoot.innerHTML = `
      <div class="overlay">
        <div class="dialog bid-dialog">
          <h2>अपनी बोली लगाएँ</h2>
          <p style="font-size:12px;">
            ${roomData.bidderIndex === -1
              ? "अभी कोई बोली नहीं — न्यूनतम बोली 8 हाथ"
              : `सर्वोच्च बोली: ${roomData.highestBid} हाथ — ${roomData.players[roomData.bidderIndex].name}`}
          </p>
          <div class="bid-hand-title">आपके 5 कार्ड</div>
          <div class="bid-hand">
            ${myPlayer.hand.slice(0, 5).map(c => cardHtml(c)).join("")}
          </div>
          <label for="bidSelect" style="font-size:12px;">कितने हाथ जीतने की बोली लगाएँ?</label>
          <select id="bidSelect">${options}</select>
          <div class="actions">
            <button id="passBtn" class="secondary" style="flex:1;">पास करें</button>
            <button id="bidBtn" style="flex:1;">बोली लगाएँ</button>
          </div>
          <p id="bidFeedback" role="alert" style="color:#ffd166;font-size:12px;min-height:16px;"></p>
          <div class="actions" style="margin-top:8px;">
            <button id="fullHouseBtn" class="secondary" style="width:100%;">Full House (खुल्ली) कहें</button>
          </div>
        </div>
      </div>
    `;

    const bidSelect = $("bidSelect");
    if (bidSelect && bidSelect.options.length === 0) {
      $("bidBtn").disabled = true;
    }

    const sendBidAction = payload => {
      const passButton = $("passBtn");
      const bidButton = $("bidBtn");
      passButton.disabled = true;
      bidButton.disabled = true;
      $("bidFeedback").textContent = "बोली भेजी जा रही है...";
      socket.timeout(7000).emit('placeBid', payload, (error, result) => {
        if (error) {
          $("bidFeedback").textContent =
            "सर्वर से जवाब नहीं मिला। कनेक्शन जाँचकर फिर कोशिश करें।";
          passButton.disabled = false;
          bidButton.disabled = !bidSelect || bidSelect.options.length === 0;
          return;
        }
        if (!result || !result.ok) {
          $("bidFeedback").textContent =
            result && result.message ? result.message : "बोली स्वीकार नहीं हुई।";
          passButton.disabled = false;
          bidButton.disabled = !bidSelect || bidSelect.options.length === 0;
          return;
        }
        modalRoot.innerHTML = "";
      });
    };

    $("passBtn").onclick = () => {
      sendBidAction({roomCode: myRoomCode, passed: true});
    };

    $("bidBtn").onclick = () => {
      const select = $("bidSelect");
      if (!select || !select.value) return;
      sendBidAction({
        roomCode: myRoomCode,
        bid: Number(select.value),
        passed: false
      });
    };
    $("fullHouseBtn").onclick = () => {
      socket.emit('callFullHouse', {roomCode: myRoomCode});
      modalRoot.innerHTML = "";
    };
  } else if (roomData.gameState === 'TRUMP_SELECT') {
    if (roomData.bidderIndex === myPlayer.seatIndex) {
      modalRoot.innerHTML = `
        <div class="overlay">
          <div class="dialog">
            <h2>ट्रंप का रंग चुनें</h2>
            <div class="bid-hand-title">आपके कार्ड</div>
            <div class="trump-hand">
              ${myPlayer.hand.map(c => cardHtml(c)).join("")}
            </div>
            <div class="suits">
              ${SUITS.map((s,i) =>
                `<button class="suitbtn ${s.red ? "red" : ""}" onclick="selectTrump(${i})">${s.symbol} ${s.name}</button>`
              ).join("")}
            </div>
          </div>
        </div>
      `;
    } else {
      const bidder = roomData.players[roomData.bidderIndex];
      modalRoot.innerHTML = `
        <div class="overlay">
          <div class="dialog">
            <h2>ट्रंप का चुनाव जारी...</h2>
            <p style="font-size:12px;">${bidder ? bidder.name : 'खिलाड़ी'} ट्रंप का रंग चुन रहे हैं।</p>
          </div>
        </div>
      `;
    }
  } else if (roomData.gameState === 'HAND_OVER') {
    const bidder = roomData.players[roomData.bidderIndex];
    const nextDealer = roomData.players[roomData.dealerIndex];

    modalRoot.innerHTML = `
      <div class="overlay">
        <div class="dialog">
          <h2>राउंड समाप्त</h2>
          ${roomData.roundMessage
            ? `<p style="font-size:13px;font-weight:bold;color:var(--gold);">${roomData.roundMessage}</p>`
            : ""}
          ${roomData.fullHouse
            ? `<p style="font-size:12px;">Full House (खुल्ली): <b>${roomData.fullHouse.result === 'SUCCESS' ? 'सफल' : 'असफल'}</b> — ${roomData.players[roomData.fullHouse.callerSeat].name} की टीम को ${roomData.fullHouse.bajiTeam === roomData.players[roomData.fullHouse.callerSeat].teamId ? 'एक बाजी मिली' : 'एक बाजी गंवानी पड़ी'}।</p>`
            : `<p style="font-size:12px;">बोली: <b>${roomData.highestBid}</b> हाथ (${bidder ? bidder.name : 'खिलाड़ी'} द्वारा)</p>`}
          ${roomData.fullHouse && roomData.fullHouse.phase === 'LATE'
            ? `<p style="font-size:12px;">सामान्य बोली: <b>${roomData.highestBid}</b> हाथ (${bidder ? bidder.name : 'खिलाड़ी'} द्वारा)</p>`
            : ""}
          <p style="font-size:12px;"><b>अपडेटेड स्कोर: ${roomData.gameScore}</b></p>
          <p style="font-size:12px;">अगले डीलर: <b>${nextDealer ? nextDealer.name : '—'}</b></p>
          <div class="actions">
            <button id="nextHandBtn" style="width:100%;">अगला राउंड शुरू करें</button>
          </div>
        </div>
      </div>
    `;

    $("nextHandBtn").onclick = () => {
      socket.emit('nextHand', {roomCode: myRoomCode});
      modalRoot.innerHTML = "";
    };
  } else if (roomData.gameState === 'MATCH_OVER') {
    modalRoot.innerHTML = `
      <div class="overlay">
        <div class="dialog" style="text-align:center;">
          <h2>🏆 मैच समाप्त</h2>
          ${roomData.roundMessage
            ? `<p style="font-size:13px;font-weight:bold;color:var(--gold);">${roomData.roundMessage}</p>`
            : ""}
          <h2 style="color:var(--gold);margin:10px 0;">टीम ${roomData.trophyWinner} ने ट्रॉफी जीती!</h2>
          <div class="actions" style="justify-content:center;">
            <button onclick="location.reload()">नया मैच खेलें</button>
          </div>
        </div>
      </div>
    `;
  } else {
    modalRoot.innerHTML = "";
  }
}

function showScoreboardModal() {
  if (!roomData) return;

  const historyRows = roomData.scoreHistory.map(h => `
    <tr>
      <td>G${h.game}-H${h.hand}</td>
      <td>${h.dealer}</td>
      <td>${h.fullHouseResult
        ? `Full House: ${h.fullHouseCaller} (${h.fullHouseResult === 'SUCCESS' ? 'सफल' : 'असफल'})${typeof h.bid === 'number' ? `; बोली ${h.bidder} (${h.bid})` : ''}`
        : `${h.bidder} (${h.bid})`}</td>
      <td>${h.startScore} ➔ <b>${h.endScore}</b></td>
    </tr>
  `).join("");

  $("modalRoot").innerHTML = `
    <div class="overlay">
      <div class="dialog">
        <h2>📊 स्कोर कार्ड</h2>
        <table class="score-table">
          <thead>
            <tr>
              <th>राउंड</th>
              <th>डीलर</th>
              <th>बोली</th>
              <th>स्कोर</th>
            </tr>
          </thead>
          <tbody>
            ${historyRows.length > 0
              ? historyRows
              : '<tr><td colspan="4">अभी कोई राउंड नहीं हुआ है</td></tr>'}
          </tbody>
        </table>
        <p style="font-size:11px;"><b>वर्तमान कुल स्कोर:</b> ${roomData.gameScore} / 52</p>
        <div class="actions">
          <button onclick="$('modalRoot').innerHTML=''" class="secondary" style="width:100%;">बंद करें</button>
        </div>
      </div>
    </div>
  `;
}

window.selectTrump = (suitIdx) => {
  socket.emit('selectTrump', {roomCode: myRoomCode, suitIndex: suitIdx});
  $("modalRoot").innerHTML = "";
};
</script>
</body>
</html>
